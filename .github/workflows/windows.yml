# Version Windows : tests Rust compilés sous Windows (le code propre à Windows, WebView2, mpv.exe, n'est
# compilé nulle part ailleurs dans le cloud) puis la version finale de l'app (`pnpm tauri build
# --no-bundle` : l'exécutable optimisé, sans installeur ni signature des mises à jour, aucune clé
# nécessaire). Jusqu'ici seul le jour de publication compilait cette version finale, sur le PC.
#
# Dépôt public `kunai974/nyx-player` (minutes gratuites) : à chaque PR qui touche l'app (chemins
# ci-dessous) et à chaque envoi sur `main`, sans étiquette. La condition `github.repository` le
# reconnaît : les mêmes fichiers servent aux deux dépôts (scripts/test/workflows-economie.test.mjs).
# Dépôt privé (atelier) : seulement avec l'étiquette `ci-github` sur la PR ou le bouton « Run workflow »
# (pas automatiquement vers `main` : quota privé, et le contenu Git LFS compte dans son propre quota).
name: Windows

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'resources/**'
      - 'scripts/binaires-natifs.mjs'
      - 'scripts/garde-publication.mjs'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows.yml'
  # Dépôt public seulement : la condition « if » de la tâche écarte les envois sur l'atelier privé.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'resources/**'
      - 'scripts/binaires-natifs.mjs'
      - 'scripts/garde-publication.mjs'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# Une autre étiquette posée sur la PR ne doit pas annuler un passage en cours : groupe à part.
concurrency:
  group: windows-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ci-github') && format('-{0}', github.run_id) || '' }}
  # Sur main (dépôt public), chaque fusion garde son passage complet : seules les PR s'annulent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: Rust sous Windows et version finale
    if: >-
      (github.repository == 'kunai974/nyx-player' && github.event.action != 'labeled') ||
      (github.event_name != 'pull_request' && github.event_name != 'push') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci-github') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
        contains(github.event.pull_request.labels.*.name, 'ci-github'))
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Valeurs factices : l'exécutable compile, sans connexion possible. Rien n'est publié ici.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Fins de ligne comme sous Git pour Windows
        run: git config --global core.autocrlf true

      # Atelier privé : mpv.exe est dans Git LFS. Dépôt public : absent de git, téléchargé plus bas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: ${{ github.repository != 'kunai974/nyx-player' }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: windows

      # Lecteur embarqué, empreinte vérifiée (déjà en place avec la bonne empreinte : rien à faire).
      # La compilation Windows le refuse s'il n'est pas le vrai programme (scripts/garde-publication.mjs).
      - name: Binaire mpv
        run: node scripts/binaires-natifs.mjs windows

      - name: Tests Rust sous Windows
        working-directory: src-tauri
        run: cargo test --locked

      # Lance aussi « pnpm build » (interface web, avec le garde-fou de publication), puis le Rust en
      # version optimisée. --no-bundle : ni installeur ni fichiers de mise à jour, donc pas de clé.
      - name: Version finale (sans installeur)
        run: pnpm tauri build --ci --no-bundle

      - name: Résumé
        shell: bash
        run: |
          exe="src-tauri/target/release/nyxplayer.exe"
          [ -f "$exe" ] || exe="$(ls src-tauri/target/release/*.exe | head -n 1)"
          {
            echo "## Version Windows"
            echo
            echo "Tests Rust sous Windows verts, version finale compilée : \`$(basename "$exe")\`, $(du -h "$exe" | cut -f1)."
            echo "Aucun fichier n'est conservé : l'installeur signé se fabrique seulement le jour de publication."
          } >> "$GITHUB_STEP_SUMMARY"
