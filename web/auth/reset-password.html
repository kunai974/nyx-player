<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password — Nyx Player</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="../styles.css">
    <script src="/auth/langue.js"></script>
</head>

<body class="page-centered" data-page="reset">
    <div class="card">
        <div class="lang-switch auth-lang" role="group" aria-label="Language / Langue">
            <button type="button" class="lang-switch__option" data-lang="en" lang="en">EN</button>
            <button type="button" class="lang-switch__option" data-lang="fr" lang="fr">FR</button>
        </div>
        <div class="brand"><img src="../assets/logo-principal-blanc.png" alt="Nyx Player"></div>
        <p class="subtitle" data-i18n="subtitle">Password Reset</p>

        <!-- Loading state: verifying token -->
        <div id="state-loading" class="spinner-container">
            <div class="spinner"></div>
            <span class="spinner-text" data-i18n="verifying">Verifying link…</span>
        </div>

        <!-- Form state -->
        <div id="state-form" class="hidden">
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="new-password" data-i18n="newPassword">New password</label>
                    <input class="form-input" id="new-password" type="password" placeholder=""
                        data-i18n-placeholder="minChars" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm-password" data-i18n="confirmPassword">Confirm password</label>
                    <input class="form-input" id="confirm-password" type="password" placeholder="Re-enter password"
                        data-i18n-placeholder="reenter" required autocomplete="new-password">
                </div>
                <div id="form-error" class="message message--error message--inline hidden"></div>
                <button type="submit" class="btn btn--primary" id="submit-btn" data-i18n="submit">Update password</button>
            </form>
        </div>

        <!-- Success state -->
        <div id="state-success" class="hidden">
            <div class="message message--success">
                <span data-i18n="success1">✓ Password updated successfully!</span><br>
                <span data-i18n="success2">You can now go back to the app and sign in.</span>
            </div>
        </div>

        <!-- Error state (link invalid) -->
        <div id="state-error" class="hidden">
            <div class="message message--error">
                <span id="error-text" data-i18n="errGeneric">An error occurred.</span>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 Nyx Player
        </div>
    </div>

    <script src="/auth/supabase-config.js"></script>
    <script src="/auth/session.js"></script>
    <script>
        /**
         * Reset Password — token_hash verify flow:
         *
         * 1. Get token_hash from URL query params
         * 2. POST /auth/v1/verify with { token_hash, type: "recovery" } → get access_token
         * 3. Show "new password" form
         * 4. On submit: PUT /auth/v1/user with access_token + new password
         */

        const L = NyxAuthLang.init(document, window);
        // Jeton lu une fois, puis retiré de l'adresse (session.js)
        const linkParams = NyxAuthSession.takeLinkParams(window);
        // Adresse et clé publique : une seule source pour les 3 pages (supabase-config.js)
        const SUPABASE_URL = window.NYX_SUPABASE.url;
        const SUPABASE_ANON_KEY = window.NYX_SUPABASE.key;

        // DOM elements
        const stateLoading = document.getElementById('state-loading');
        const stateForm = document.getElementById('state-form');
        const stateSuccess = document.getElementById('state-success');
        const stateError = document.getElementById('state-error');
        const errorText = document.getElementById('error-text');
        const formError = document.getElementById('form-error');
        const resetForm = document.getElementById('reset-form');
        const submitBtn = document.getElementById('submit-btn');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');

        let accessToken = null;

        // Longueur minimale du mot de passe (10 caractères, comme l'app, MIN_PASSWORD_LENGTH de
        // src/utils/passwordPolicy.ts ; le serveur demande encore 8 jusqu'à ce que son réglage passe à 10). Une seule valeur :
        // les champs, le texte d'aide et la vérification la lisent ici.
        const MIN_PASSWORD = 10;
        newPasswordInput.minLength = MIN_PASSWORD;
        confirmPasswordInput.minLength = MIN_PASSWORD;
        L.vars({ min: MIN_PASSWORD });

        function showState(state) {
            stateLoading.classList.add('hidden');
            stateForm.classList.add('hidden');
            stateSuccess.classList.add('hidden');
            stateError.classList.add('hidden');
            state.classList.remove('hidden');
        }

        // Clé du message, et le message anglais du serveur s'il y en a un.
        function showFormError(key, serverMessage) {
            L.set(formError, key, serverMessage);
            formError.classList.remove('hidden');
        }

        function hideFormError() {
            formError.classList.add('hidden');
        }

        // --- Step 1: Verify token_hash and get session ---

        async function verifyToken() {
            const tokenHash = linkParams.get('token_hash');
            const type = linkParams.get('type') || 'recovery';

            if (!tokenHash) {
                L.set(errorText, 'errMissing');
                showState(stateError);
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                    },
                    body: JSON.stringify({ token_hash: tokenHash, type }),
                });

                if (response.ok) {
                    const data = await response.json();
                    accessToken = data.access_token;
                    showState(stateForm);
                    newPasswordInput.focus();
                } else {
                    const data = await response.json().catch(() => ({}));
                    L.set(errorText, 'errExpired', data.error_description || data.msg);
                    showState(stateError);
                }
            } catch (err) {
                L.set(errorText, 'errNetwork');
                showState(stateError);
            }
        }

        // --- Step 2: Submit new password ---

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideFormError();

            const password = newPasswordInput.value;
            const confirm = confirmPasswordInput.value;

            // Validation
            if (password.length < MIN_PASSWORD) {
                showFormError('errTooShort');
                return;
            }

            if (password !== confirm) {
                showFormError('errMismatch');
                return;
            }

            submitBtn.disabled = true;
            L.set(submitBtn, 'updating');

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                    },
                    body: JSON.stringify({ password }),
                });

                if (response.ok) {
                    showState(stateSuccess);
                    // Session ouverte par le lien : plus utile une fois le mot de passe changé
                    await NyxAuthSession.endLinkSession(window, SUPABASE_URL, SUPABASE_ANON_KEY, accessToken);
                    accessToken = null;
                } else {
                    const data = await response.json().catch(() => ({}));
                    showFormError('errUpdate', data.error_description || data.msg);
                    submitBtn.disabled = false;
                    L.set(submitBtn, 'submit');
                }
            } catch (err) {
                showFormError('errNetwork');
                submitBtn.disabled = false;
                L.set(submitBtn, 'submit');
            }
        });

        // Start
        verifyToken();
    </script>
</body>

</html>
